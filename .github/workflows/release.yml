name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to create (for example v0.1.0)
        required: true
        type: string
      version:
        description: Application version without the v prefix (for example 0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Install FFmpeg development libraries
        shell: pwsh
        run: |
          winget install --exact --id BtbN.FFmpeg.LGPL.Shared.8.1 --accept-package-agreements --accept-source-agreements
          $package = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Directory -Filter "BtbN.FFmpeg.LGPL.Shared.8.1_*" |
            Get-ChildItem -Directory |
            Select-Object -First 1
          if (-not $package -or -not (Test-Path "$($package.FullName)\include") -or -not (Test-Path "$($package.FullName)\lib") -or -not (Test-Path "$($package.FullName)\bin")) {
            throw "The FFmpeg shared development build was not found."
          }
          "FFMPEG_DIR=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies and test
        run: |
          npm ci
          cargo test --manifest-path backend/Cargo.toml

      - name: Synchronize release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm run version:set -- $env:RELEASE_VERSION

      - name: Build Windows installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run app:build -- --bundles nsis,msi

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "/DMyAppVersion=${{ inputs.version }}" installer\AudioNormalizer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create updater manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem backend\target\release\bundle\nsis\*.exe | Select-Object -First 1
          $signature = Get-Content "$($installer.FullName).sig" -Raw
          $manifest = @{
            version = "${{ inputs.version }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/$($installer.Name)"
                signature = $signature.Trim()
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem backend\target\release\bundle\nsis\*.exe, backend\target\release\bundle\msi\*.msi, backend\target\release\bundle\inno\*.exe, latest.json | ForEach-Object FullName
          if (-not $assets) { throw "No Windows installers were produced." }
          $pre = if ('${{ inputs.prerelease }}' -eq 'true') { '--prerelease' } else { '' }
          gh release create "${{ inputs.tag }}" $assets --title "Audio Normalizer ${{ inputs.version }}" --generate-notes $pre
