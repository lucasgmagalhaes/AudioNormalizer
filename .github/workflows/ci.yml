name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install lint dependencies
        run: npm run lint:install

      - name: Lint
        run: npm run lint

      - name: Test UI capabilities
        run: npm run test:ui

      - name: Build frontend
        run: npm run build

  rust-tests:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Restore FFmpeg development libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Microsoft\WinGet\Packages\BtbN.FFmpeg.LGPL.Shared.8.1_Microsoft.Winget.Source_8wekyb3d8bbwe
          key: ${{ runner.os }}-ffmpeg-lgpl-shared-8.1

      - name: Install FFmpeg development libraries
        shell: pwsh
        run: |
          $packageRoot = "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\BtbN.FFmpeg.LGPL.Shared.8.1_Microsoft.Winget.Source_8wekyb3d8bbwe"
          if (-not (Test-Path $packageRoot)) {
            winget install --exact --id BtbN.FFmpeg.LGPL.Shared.8.1 --accept-package-agreements --accept-source-agreements
          }
          $package = Get-ChildItem $packageRoot -Directory | Select-Object -First 1
          if (-not $package -or -not (Test-Path "$($package.FullName)\include") -or -not (Test-Path "$($package.FullName)\lib") -or -not (Test-Path "$($package.FullName)\bin")) {
            throw "The FFmpeg shared development build was not found."
          }
          "FFMPEG_DIR=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Rust tests
        run: cargo test --manifest-path backend/Cargo.toml

  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Restore FFmpeg development libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Microsoft\WinGet\Packages\BtbN.FFmpeg.LGPL.Shared.8.1_Microsoft.Winget.Source_8wekyb3d8bbwe
          key: ${{ runner.os }}-ffmpeg-lgpl-shared-8.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install FFmpeg development libraries
        shell: pwsh
        run: |
          $packageRoot = "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\BtbN.FFmpeg.LGPL.Shared.8.1_Microsoft.Winget.Source_8wekyb3d8bbwe"
          if (-not (Test-Path $packageRoot)) {
            winget install --exact --id BtbN.FFmpeg.LGPL.Shared.8.1 --accept-package-agreements --accept-source-agreements
          }
          $package = Get-ChildItem $packageRoot -Directory | Select-Object -First 1
          if (-not $package -or -not (Test-Path "$($package.FullName)\include") -or -not (Test-Path "$($package.FullName)\lib") -or -not (Test-Path "$($package.FullName)\bin")) {
            throw "The FFmpeg shared development build was not found."
          }
          "FFMPEG_DIR=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Rust tests with coverage
        run: cargo llvm-cov --manifest-path backend/Cargo.toml --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: lcov.info
          flags: rust
          fail_ci_if_error: true
